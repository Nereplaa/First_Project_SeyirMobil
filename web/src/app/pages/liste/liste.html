<section class="card">
  <h2>Yeni Kayıt Ekle</h2>
  <div class="field-row">
    <div class="field">
      <label for="wizardPlaka">1. Plaka</label>
      <dx-select-box
        id="wizardPlaka"
        [dataSource]="plakalar()"
        displayExpr="aracPlaka"
        valueExpr="aracId"
        placeholder="— Seçiniz —"
        [value]="wizardAracId"
        (onValueChanged)="wizardPlakaDegisti($event)"
        width="200"
      ></dx-select-box>
    </div>

    @if (wizardAracId != null) {
      <div class="field">
        <label for="wizardTarih">2. Veri Tarihi</label>
        <dx-date-box
          id="wizardTarih"
          type="date"
          pickerType="calendar"
          displayFormat="dd.MM.yyyy"
          [value]="wizardTarihDate"
          (onValueChanged)="wizardTarihDegisti($event)"
          width="160"
        ></dx-date-box>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <dx-button
          text="Tarihi Onayla →"
          type="normal"
          [disabled]="sinirlarHesaplaniyor()"
          (onClick)="tarihiOnayla()"
        ></dx-button>
      </div>
    }

    @if (tarihOnaylandi()) {
      <div class="field">
        <label for="wizardHiz">3. Hız</label>
        <dx-number-box
          id="wizardHiz"
          [min]="0"
          [max]="300"
          [value]="wizardHiz"
          (onValueChanged)="wizardHiz = $event.value ?? 0"
          width="90"
        ></dx-number-box>
      </div>
      <div class="field">
        <label for="wizardKm">4. Km Sayacı</label>
        <dx-number-box
          id="wizardKm"
          format="#,##0.00"
          [min]="kmMin()"
          [max]="kmMax()"
          [value]="wizardKm"
          (onValueChanged)="wizardKm = $event.value ?? 0"
          width="150"
        ></dx-number-box>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <dx-button
          text="Ekle"
          type="default"
          [disabled]="!ekleEtkin() || ekleniyor()"
          (onClick)="ekle()"
        ></dx-button>
      </div>
    }
  </div>

  @if (sinirBilgisi()) {
    <p class="status-text" style="white-space: pre-line; margin-top: 0.75rem">{{ sinirBilgisi() }}</p>
  }
</section>

<section class="card">
  <h2>Filtre</h2>
  <div class="field-row">
    <div class="field">
      <label for="filtrePlaka">Plaka</label>
      <dx-select-box
        id="filtrePlaka"
        [dataSource]="filtrePlakaListesi()"
        [value]="filtrePlaka"
        (onValueChanged)="filtrePlaka = $event.value"
        width="150"
      ></dx-select-box>
    </div>
    <div class="field">
      <label for="filtreTarih">Tarih</label>
      <div style="display: flex; align-items: center; gap: 0.4rem">
        <dx-check-box [value]="filtreTarihAktif" (onValueChanged)="filtreTarihAktif = !!$event.value"></dx-check-box>
        <dx-date-box
          id="filtreTarih"
          type="date"
          pickerType="calendar"
          displayFormat="dd.MM.yyyy"
          [disabled]="!filtreTarihAktif"
          [value]="filtreTarihDate"
          (onValueChanged)="filtreTarihDate = $event.value ?? filtreTarihDate"
          width="140"
        ></dx-date-box>
      </div>
    </div>
    <div class="field">
      <label for="filtreHiz">Hız</label>
      <dx-number-box
        id="filtreHiz"
        [showClearButton]="true"
        [value]="$any(filtreHiz)"
        (onValueChanged)="filtreHiz = $event.value ?? null"
        width="90"
      ></dx-number-box>
    </div>
    <div class="field">
      <label for="filtreKm">Km Sayacı</label>
      <dx-number-box
        id="filtreKm"
        format="#,##0.00"
        [showClearButton]="true"
        [value]="$any(filtreKm)"
        (onValueChanged)="filtreKm = $event.value ?? null"
        width="120"
      ></dx-number-box>
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <div style="display: flex; gap: 0.5rem">
        <dx-button text="Filtrele" type="default" (onClick)="filtreleUygula()"></dx-button>
        <dx-button text="Temizle" type="normal" (onClick)="filtreleTemizle()"></dx-button>
      </div>
    </div>
  </div>
  @if (filtreHatasi()) {
    <p class="error-text" style="margin-top: 0.5rem">{{ filtreHatasi() }}</p>
  }
</section>

<section class="card">
  <div class="field-row" style="justify-content: space-between; margin-bottom: 0.75rem">
    <h2 style="margin: 0">Araç Hareketleri</h2>
    <div style="display: flex; gap: 0.5rem">
      <dx-button text="Yenile" type="normal" (onClick)="refreshGrid()"></dx-button>
      <dx-button text="Sil" type="danger" [disabled]="!seciliHareket()" (onClick)="sil()"></dx-button>
      <input #importDosyaSecici type="file" accept=".xlsx" hidden (change)="excelDenAktarSecildi($event)" />
      <dx-button
        text="Excel'den Veri Aktar"
        type="normal"
        stylingMode="outlined"
        (onClick)="importDosyaSecici.click()"
      ></dx-button>
    </div>
  </div>

  <dx-data-grid
    [dataSource]="gosterilenHareketler()"
    [columns]="dataGridColumns"
    [showBorders]="true"
    [rowAlternationEnabled]="true"
    [selection]="{ mode: 'single' }"
    [paging]="{ pageSize: ilkSayfaBoyutu }"
    [pager]="{
      visible: true,
      showPageSizeSelector: true,
      allowedPageSizes: sayfaBoyutuSecenekleri,
      showInfo: true,
      showNavigationButtons: true
    }"
    [searchPanel]="{ visible: true, placeholder: 'Ara...' }"
    [export]="{ enabled: true }"
    (onSelectionChanged)="onSelectionChanged($event)"
    (onExporting)="onExporting($event)"
  ></dx-data-grid>

  <p class="status-text" style="margin-top: 0.75rem">{{ statusText() }}</p>
</section>
