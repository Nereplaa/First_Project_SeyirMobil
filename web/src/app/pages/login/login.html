<div class="login-sayfasi">
  <div class="card login-kart">
    <h2>Seyir Mobil'e Giriş Yap</h2>

    <div class="field">
      <label for="username">Kullanıcı Adı</label>
      <dx-text-box
        id="username"
        [value]="username()"
        (onValueChanged)="username.set($event.value ?? '')"
        (onEnterKey)="girisYap()"
      ></dx-text-box>
    </div>

    <div class="field">
      <label for="password">Şifre</label>
      <dx-text-box
        id="password"
        mode="password"
        [value]="password()"
        (onValueChanged)="password.set($event.value ?? '')"
        (onEnterKey)="girisYap()"
      ></dx-text-box>
    </div>

    @if (hataMesaji()) {
      <p class="error-text">{{ hataMesaji() }}</p>
    }

    <dx-button
      [text]="girisYapiliyor() ? 'Giriş yapılıyor...' : 'Giriş Yap'"
      type="default"
      [disabled]="girisYapiliyor()"
      (onClick)="girisYap()"
    ></dx-button>
  </div>
</div>
