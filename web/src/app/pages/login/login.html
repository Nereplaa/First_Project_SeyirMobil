<div class="login-sayfasi">
  <form class="card login-kart" (ngSubmit)="girisYap()">
    <h2>Seyir Mobil'e Giriş Yap</h2>

    <div class="field">
      <label for="username">Kullanıcı Adı</label>
      <input
        id="username"
        type="text"
        name="username"
        autocomplete="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
      />
    </div>

    <div class="field">
      <label for="password">Şifre</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
    </div>

    @if (hataMesaji()) {
      <p class="error-text">{{ hataMesaji() }}</p>
    }

    <button type="submit" class="primary" [disabled]="girisYapiliyor()">
      {{ girisYapiliyor() ? 'Giriş yapılıyor...' : 'Giriş Yap' }}
    </button>
  </form>
</div>
