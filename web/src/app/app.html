<header class="app-header">
  <h1>Seyir Mobil — Araç Takip</h1>
  @if (auth.girisYapilmisMi()) {
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Araç Hareketleri</a>
      <a routerLink="/rapor" routerLinkActive="active">Araç Hareket Raporu</a>
      @if (auth.role() === 'Admin') {
        <a routerLink="/admin" routerLinkActive="active">Admin Paneli</a>
      }
    </nav>
    <div class="kullanici-bilgisi">
      <span>{{ auth.username() }} ({{ auth.role() }})</span>
      <dx-button text="Çıkış Yap" stylingMode="outlined" (onClick)="cikisYap()"></dx-button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
